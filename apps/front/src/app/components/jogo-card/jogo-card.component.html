<article class="card">
  <img class="capa" [src]="jogo.imagemUrl" [alt]="'Capa de ' + jogo.titulo" />

  <div class="conteudo">
    <div class="cabecalho">
      <span>{{ jogo.genero }}</span>
      <strong>{{ jogo.nota }}</strong>
    </div>

    <h2>{{ jogo.titulo }}</h2>
    <p>{{ jogo.plataforma }} · {{ jogo.anoLancamento }}</p>
    <a [routerLink]="['/jogos', jogo._id]">Ver detalhes</a>
  </div>
</article>
